name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Throwaway database for checking the Prisma migrations. No secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uag
          POSTGRES_PASSWORD: uag_ci
          POSTGRES_DB: uag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://uag:uag_ci@localhost:5432/uag

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Check the migrations match prisma/schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - run: npm run build

  python-clients:
    name: Python clients
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
