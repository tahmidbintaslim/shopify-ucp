name: Bug report
description: Something in the app or the MCP endpoint does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not post access tokens, API secrets or customer data.
        To report a security issue, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For the MCP endpoint, include the JSON-RPC request body and the HTTP status you got.
      placeholder: |
        1. Run ...
        2. POST to /api/mcp/<shop> with ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP endpoint (/api/mcp/:shop)
        - Store profile (App Proxy)
        - Embedded admin (dashboard, settings, test chat)
        - Webhooks
        - Theme app embed
        - Setup, build or CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it
      options:
        - Local, without a Shopify store (placeholder shop)
        - Local, with shopify app dev on a development store
        - Deployed (Vercel or other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or branch
      placeholder: e.g. main at abc1234
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.11.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines, with secrets removed.
      render: text
