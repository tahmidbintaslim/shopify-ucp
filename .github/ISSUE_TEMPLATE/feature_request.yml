name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the "Status and roadmap" section of the README first; some items there are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the app or the endpoint to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
