version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait two weeks before proposing a new release. Security updates are not delayed.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Lift when @shopify/shopify-app-session-storage-prisma supports Prisma 7.
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      # Lift after the Remix 2 to React Router 7 move: @remix-run/dev supports Vite 5-6 only.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
